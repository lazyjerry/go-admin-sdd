type: collection.insomnia.rest/5.0
name: Go-Admin API Collection
meta:
  id: wrk_go_admin_api_collection
  created: 1726736400000
  modified: 1726736400000
  description: "Go-Admin 後台管理系統完整 API 測試集合，包含使用者管理、權限控制、系統配置等核心功能的 RESTful API 端點"
collection:
  # 系統健康檢查
  - url: "{{ _.base_url }}/api/v1/health"
    name: "系統健康檢查"
    meta:
      id: req_health_check
      created: 1726736400000
      modified: 1726736400000
      isPrivate: false
      description: "檢查系統狀態和服務可用性"
      sortKey: 1000
    method: GET
    headers:
      - name: Accept
        value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true

  # 使用者認證
  - url: "{{ _.base_url }}/api/v1/login"
    name: "使用者登入"
    meta:
      id: req_user_login
      created: 1726736400000
      modified: 1726736400000
      isPrivate: false
      description: "使用者身份驗證，取得 JWT Token"
      sortKey: 2000
    method: POST
    body:
      mimeType: application/json
      text: |
        {
          "username": "admin",
          "password": "123456",
          "code": "",
          "uuid": ""
        }
    headers:
      - name: Accept
        value: application/json
      - name: Content-Type
        value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true

  - url: "{{ _.base_url }}/api/v1/logout"
