      id: req_user_logout
      created: 1726736400000
      modified: 1726736400000
      isPrivate: false
      description: "使用者登出，清除 JWT Token"
      sortKey: 2100
    method: POST
    headers:
      - name: Accept
        value: application/json
      - name: Authorization
        value: "Bearer {{ _.jwt_token }}"
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true

