        {
          "username": "testuser",
          "nickName": "測試使用者",
          "phone": "0912345678",
          "email": "test@example.com",
          "avatar": "",
          "sex": "1",
          "deptId": 1,
          "postId": 1,
          "roleId": 2,
          "remark": "測試使用者帳號",
          "status": "2",
          "password": "password123"
        }
